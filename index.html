<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>睡前健身助理</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0B0F19; color: #E5E7EB; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-950 text-gray-200 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_HEALTH_NOTE = "右腿曾經扭傷；有扁平足和足底筋膜炎，容易因腳踝、足底過度受力而不適（嚴禁墊腳尖、深蹲、跳躍）。睡床上舖，動作需溫和且安靜。";

    const DEFAULT_LIBRARY = [
      { id: '1', name: '貓犬式伸展', target: '背', detail: '四足跪姿，吸氣拱背抬頭，吐氣圓背低頭。放鬆脊椎。' },
      { id: '2', name: '仰臥抱膝親膝', target: '腰', detail: '平躺於床上，雙手抱住雙膝拉向胸口，輕輕左右搖晃放鬆下背。' },
      { id: '3', name: '臥姿橋式', target: '屁股', detail: '平躺膝蓋彎曲，雙腳平貼床面，臀部發力抬起，足底貼平不墊腳。' },
      { id: '4', name: '仰臥腿後側伸展', target: '大腿', detail: '平躺抬腿，雙手扣住大腿後側輕拉，腳踝放鬆。' },
      { id: '5', name: '睡蓮式肩膀開展', target: '肩', detail: '側臥於床上，雙手前伸重疊，上方手臂向後打開。' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('today');
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('gemini_api_key') || '');
      const [showKeyModal, setShowKeyModal] = useState(!localStorage.getItem('gemini_api_key'));
      const [healthNote, setHealthNote] = useState(() => localStorage.getItem('health_note') || DEFAULT_HEALTH_NOTE);
      
      // 動作庫 State
      const [library, setLibrary] = useState(() => {
        const saved = localStorage.getItem('ex_library');
        return saved ? JSON.parse(saved) : DEFAULT_LIBRARY;
      });

      // 運動紀錄 State
      const [logs, setLogs] = useState(() => {
        const saved = localStorage.getItem('ex_logs');
        return saved ? JSON.parse(saved) : [];
      });

      // 今日菜單 State
      const [todayCondition, setTodayCondition] = useState('一切正常');
      const [selectedTargets, setSelectedTargets] = useState([]);
      const [duration, setDuration] = useState('10');
      const [todayMenu, setTodayMenu] = useState(() => {
        const saved = localStorage.getItem('today_menu');
        return saved ? JSON.parse(saved) : [];
      });
      const [checkedMenu, setCheckedMenu] = useState({});
      const [isGenerating, setIsGenerating] = useState(false);

      // 手動新增動作庫 Modal State
      const [showAddLibModal, setShowAddLibModal] = useState(false);
      const [newLibName, setNewLibName] = useState('');
      const [newLibTarget, setNewLibTarget] = useState('全身');
      const [newLibDetail, setNewLibDetail] = useState('');

      // 手動新增紀錄 Modal State
      const [showAddLogModal, setShowAddLogModal] = useState(false);
      const [newLogName, setNewLogName] = useState('');
      const [newLogMins, setNewLogMins] = useState('10');

      // AI 對話 State
      const [chatMessages, setChatMessages] = useState(() => {
        const saved = localStorage.getItem('chat_messages');
        return saved ? JSON.parse(saved) : [{ role: 'model', text: '嗨！我是你的睡前健身助理。今天想做什麼伸展呢？' }];
      });
      const [chatInput, setChatInput] = useState('');
      const [isChatLoading, setIsChatLoading] = useState(false);

      useEffect(() => { localStorage.setItem('gemini_api_key', apiKey); }, [apiKey]);
      useEffect(() => { localStorage.setItem('health_note', healthNote); }, [healthNote]);
      useEffect(() => { localStorage.setItem('ex_library', JSON.stringify(library)); }, [library]);
      useEffect(() => { localStorage.setItem('ex_logs', JSON.stringify(logs)); }, [logs]);
      useEffect(() => { localStorage.setItem('today_menu', JSON.stringify(todayMenu)); }, [todayMenu]);
      useEffect(() => { localStorage.setItem('chat_messages', JSON.stringify(chatMessages)); }, [chatMessages]);

      const callGemini = async (promptText) => {
        if (!apiKey) {
          setShowKeyModal(true);
          throw new Error('請先設定 Gemini API Key');
        }
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            systemInstruction: { parts: [{ text: `你是一位專屬睡前伸展健身助理。使用者限制：${healthNote}。請確保動作安全。` }] }
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || 'API 呼叫失敗');
        return data.candidates[0].content.parts[0].text;
      };

      const generateMenu = async () => {
        setIsGenerating(true);
        try {
          const prompt = `請產生一份 JSON 格式的睡前伸展菜單。總時長：${duration}分鐘。狀況：${todayCondition}。想練部位：${selectedTargets.join(',') || '輪替'}。請嚴格僅輸出 JSON 陣列，格式為：[{"name":"動作名","target":"部位","detail":"做法","duration":"2分鐘"}]`;
          const text = await callGemini(prompt);
          const cleanText = text.replace(/```json/g, '').replace(/```/g, '').trim();
          const menuData = JSON.parse(cleanText);
          setTodayMenu(menuData);
          setCheckedMenu({});
        } catch (err) {
          alert("產生失敗: " + err.message + "。改載入固定菜單。");
          setTodayMenu(library.slice(0, 4).map(i => ({ ...i, duration: '2分鐘' })));
        } finally {
          setIsGenerating(false);
        }
      };

      // 儲存完成的今日菜單動作
      const saveCheckedMenuLogs = () => {
        const completed = todayMenu.filter((_, idx) => checkedMenu[idx]);
        if (completed.length === 0) {
          alert("請先勾選已完成的動作！");
          return;
        }
        const nowStr = new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        const newEntries = completed.map(item => {
          const mins = parseInt(item.duration) || 2;
          const cal = Math.round(mins * 3.5); // 睡前溫和伸展約 3.5 kcal/min
          return {
            id: Date.now().toString() + Math.random(),
            date: nowStr,
            name: item.name,
            duration: `${mins} 分鐘`,
            calories: `${cal} kcal`,
            source: '今日菜單'
          };
        });
        setLogs(prev => [...newEntries, ...prev]);
        alert(`已成功記錄 ${completed.length} 個完成動作！`);
      };

      // 手動新增動作至動作庫
      const handleAddLibrary = () => {
        if (!newLibName.trim()) return;
        const newItem = {
          id: Date.now().toString(),
          name: newLibName.trim(),
          target: newLibTarget || '全身',
          detail: newLibDetail.trim() || '無詳細說明'
        };
        setLibrary(prev => [...prev, newItem]);
        setNewLibName('');
        setNewLibDetail('');
        setShowAddLibModal(false);
      };

      // 刪除動作庫項目
      const handleDeleteLibrary = (id) => {
        setLibrary(prev => prev.filter(item => item.id !== id));
      };

      // 手動新增運動紀錄
      const handleAddLog = () => {
        if (!newLogName.trim()) return;
        const mins = parseInt(newLogMins) || 10;
        const cal = Math.round(mins * 3.5);
        const nowStr = new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        const newLog = {
          id: Date.now().toString(),
          date: nowStr,
          name: newLogName.trim(),
          duration: `${mins} 分鐘`,
          calories: `${cal} kcal`,
          source: '手動輸入'
        };
        setLogs(prev => [newLog, ...prev]);
        setNewLogName('');
        setShowAddLogModal(false);
      };

      // 刪除運動紀錄
      const handleDeleteLog = (id) => {
        setLogs(prev => prev.filter(log => log.id !== id));
      };

      const handleSendChat = async () => {
        if (!chatInput.trim() || isChatLoading) return;
        const newMsgs = [...chatMessages, { role: 'user', text: chatInput }];
        setChatMessages(newMsgs);
        setChatInput('');
        setIsChatLoading(true);
        try {
          const ans = await callGemini(chatInput);
          setChatMessages([...newMsgs, { role: 'model', text: ans }]);
        } catch (err) {
          alert('對話失敗: ' + err.message);
        } finally {
          setIsChatLoading(false);
        }
      };

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-950 pb-20">
          <header className="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-10">
            <h1 className="text-lg font-bold text-indigo-400">🌙 睡前健身助理</h1>
            <button onClick={() => setShowKeyModal(true)} className="text-xs bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">⚙️ 金鑰設定</button>
          </header>

          <main className="p-4 flex-1 space-y-4">
            {/* TAB 1: 今日菜單 */}
            {activeTab === 'today' && (
              <div className="space-y-4">
                <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs">
                  <div className="text-amber-400 font-semibold mb-1">⚠️ 身體狀況限制</div>
                  <div className="text-gray-400">{healthNote}</div>
                </div>

                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2">
                  <label className="text-xs font-semibold text-gray-300">今天身體狀況</label>
                  <div className="flex gap-2 flex-wrap">
                    {['一切正常', '生理期', '腿痛', '很累'].map(c => (
                      <button key={c} onClick={() => setTodayCondition(c)} className={`px-3 py-1.5 rounded-lg text-xs ${todayCondition === c ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-gray-400'}`}>{c}</button>
                    ))}
                  </div>
                </div>

                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2">
                  <label className="text-xs font-semibold text-gray-300">加強部位 (可多選)</label>
                  <div className="flex gap-2 flex-wrap">
                    {['肩', '背', '腰', '胯', '屁股', '大腿'].map(t => {
                      const sel = selectedTargets.includes(t);
                      return (
                        <button key={t} onClick={() => setSelectedTargets(sel ? selectedTargets.filter(x=>x!==t) : [...selectedTargets, t])} className={`px-3 py-1.5 rounded-lg text-xs ${sel ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-gray-400'}`}>{t}</button>
                      );
                    })}
                  </div>
                </div>

                <button onClick={generateMenu} disabled={isGenerating} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm">
                  {isGenerating ? 'AI 生成菜單中...' : '✨ 產生今日菜單'}
                </button>

                {todayMenu.length > 0 && (
                  <div className="space-y-3 pt-2">
                    <h2 className="text-sm font-bold text-gray-300">今日菜單</h2>
                    {todayMenu.map((m, i) => (
                      <div key={i} className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-start gap-3">
                        <input type="checkbox" checked={!!checkedMenu[i]} onChange={e => setCheckedMenu({...checkedMenu, [i]: e.target.checked})} className="mt-1 w-4 h-4" />
                        <div>
                          <div className="font-bold text-sm text-white">{m.name} <span className="text-xs font-normal text-indigo-400">({m.target} · {m.duration})</span></div>
                          <div className="text-xs text-gray-400 mt-1">{m.detail}</div>
                        </div>
                      </div>
                    ))}
                    <button onClick={saveCheckedMenuLogs} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs">
                      ✅ 記錄已勾選的運動至運動記錄
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: 運動記錄 */}
            {activeTab === 'logs' && (
              <div className="space-y-3">
                <div className="flex justify-between items-center">
                  <h2 className="font-bold text-sm text-white">運動記錄 ({logs.length})</h2>
                  <button onClick={() => setShowAddLogModal(true)} className="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-semibold">
                    ＋ 手動新增紀錄
                  </button>
                </div>

                {logs.length === 0 ? (
                  <div className="text-center py-10 text-gray-500 text-xs">目前尚無運動紀錄，快去完成今日菜單吧！</div>
                ) : (
                  <div className="space-y-2">
                    {logs.map(log => (
                      <div key={log.id} className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center">
                        <div className="space-y-1">
                          <div className="font-bold text-sm text-white flex items-center gap-2">
                            {log.name}
                            <span className="text-[10px] bg-slate-800 text-indigo-300 px-1.5 py-0.5 rounded border border-slate-700">{log.source}</span>
                          </div>
                          <div className="text-xs text-gray-400">
                            ⏱️ {log.duration}  |  🔥 預估消耗 {log.calories}
                          </div>
                          <div className="text-[10px] text-gray-500">{log.date}</div>
                        </div>
                        <button onClick={() => handleDeleteLog(log.id)} className="text-gray-500 hover:text-red-400 text-xs p-1">
                          ✕
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: 動作庫 */}
            {activeTab === 'library' && (
              <div className="space-y-3">
                <div className="flex justify-between items-center">
                  <h2 className="font-bold text-sm text-white">動作庫 ({library.length})</h2>
                  <button onClick={() => setShowAddLibModal(true)} className="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-semibold">
                    ＋ 新增動作
                  </button>
                </div>

                <div className="space-y-2">
                  {library.map(item => (
                    <div key={item.id} className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-start">
                      <div className="space-y-1">
                        <div className="font-bold text-indigo-300 text-sm">
                          {item.name} <span className="text-xs text-gray-400">({item.target})</span>
                        </div>
                        <div className="text-xs text-gray-400">{item.detail}</div>
                      </div>
                      <button onClick={() => handleDeleteLibrary(item.id)} className="text-gray-500 hover:text-red-400 text-xs p-1">
                        🗑️
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 4: 問助理 */}
            {activeTab === 'chat' && (
              <div className="flex flex-col h-[65vh]">
                <div className="flex-1 overflow-y-auto space-y-2 py-2">
                  {chatMessages.map((msg, i) => (
                    <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[80%] p-3 rounded-xl text-xs ${msg.role === 'user' ? 'bg-indigo-600 text-white' : 'bg-slate-900 border border-slate-800 text-gray-300'}`}>
                        {msg.text}
                      </div>
                    </div>
                  ))}
                  {isChatLoading && <div className="text-xs text-gray-500">助理思考中...</div>}
                </div>
                <div className="flex gap-2">
                  <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="輸入想問的問題..." className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" />
                  <button onClick={handleSendChat} className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold">發送</button>
                </div>
              </div>
            )}
          </main>

          {/* 底部 Tab 導覽列 */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900 border-t border-slate-800 flex justify-around p-3 z-20 text-xs">
            <button onClick={() => setActiveTab('today')} className={activeTab === 'today' ? 'text-indigo-400 font-bold' : 'text-gray-400'}>今日菜單</button>
            <button onClick={() => setActiveTab('logs')} className={activeTab === 'logs' ? 'text-indigo-400 font-bold' : 'text-gray-400'}>運動記錄</button>
            <button onClick={() => setActiveTab('library')} className={activeTab === 'library' ? 'text-indigo-400 font-bold' : 'text-gray-400'}>動作庫</button>
            <button onClick={() => setActiveTab('chat')} className={activeTab === 'chat' ? 'text-indigo-400 font-bold' : 'text-gray-400'}>問助理</button>
          </nav>

          {/* Modal: 手動新增動作庫 */}
          {showAddLibModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full space-y-3">
                <h3 className="font-bold text-white text-base">新增動作至動作庫</h3>
                <input type="text" placeholder="動作名稱（如：嬰兒式放鬆）" value={newLibName} onChange={e => setNewLibName(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-xs text-white" />
                <input type="text" placeholder="主要部位（如：腰、背、肩）" value={newLibTarget} onChange={e => setNewLibTarget(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-xs text-white" />
                <textarea placeholder="動作說明與備註..." value={newLibDetail} onChange={e => setNewLibDetail(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-xs text-white" rows="3" />
                <div className="flex gap-2">
                  <button onClick={() => setShowAddLibModal(false)} className="flex-1 bg-slate-800 text-gray-400 py-2 rounded-xl text-xs">取消</button>
                  <button onClick={handleAddLibrary} className="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">確定新增</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal: 手動新增運動紀錄 */}
          {showAddLogModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full space-y-3">
                <h3 className="font-bold text-white text-base">手動新增運動紀錄</h3>
                <input type="text" placeholder="做了什麼運動？（如：睡前瑜珈）" value={newLogName} onChange={e => setNewLogName(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-xs text-white" />
                <div className="flex items-center gap-2 text-xs text-gray-300">
                  <span>做了多久：</span>
                  <input type="number" value={newLogMins} onChange={e => setNewLogMins(e.target.value)} className="w-20 bg-slate-950 border border-slate-700 rounded-xl p-2 text-xs text-white" />
                  <span>分鐘</span>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => setShowAddLogModal(false)} className="flex-1 bg-slate-800 text-gray-400 py-2 rounded-xl text-xs">取消</button>
                  <button onClick={handleAddLog} className="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">儲存紀錄</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal: API Key 設定 */}
          {showKeyModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full space-y-3">
                <h3 className="font-bold text-white text-base">輸入 Gemini API Key</h3>
                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="AIzaSy..." className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white" />
                <button onClick={() => setShowKeyModal(false)} className="w-full bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">儲存並開始</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
